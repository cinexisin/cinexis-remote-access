name: "Cinexis Remote Access"
description: "Secure remote access and Alexa Smart Home for Home Assistant via Cinexis Cloud. No port forwarding required."
version: "1.16.0"
slug: "cinexis_remote"
init: false
arch:
  - amd64
  - aarch64
  - armv7
image: "ghcr.io/cinexisin/cinexis-remote-access/{arch}"
homeassistant: "2023.1.0"
startup: services
boot: auto
apparmor: true
ingress: true
ingress_port: 18082
panel_icon: mdi:cloud-lock
panel_title: Cinexis
homeassistant_api: true
hassio_api: true
# Expose the WhatsApp Web service to the HA host so REST commands /
# automations defined in HA's configuration.yaml can hit it. Port is
# user-configurable in case 18083 collides with another addon.
ports:
  "18083/tcp": 18083
ports_description:
  "18083/tcp": "WhatsApp send endpoint — HA REST commands talk to this. See addon UI for snippet."
map:
  - type: share
    read_only: false
options:
  log_level: info
  name_prefix: ""
  alexa_backend: self
  bot_host: ""
schema:
  log_level: list(trace|debug|info|warning|error)
  name_prefix: str
  alexa_backend: list(self|bot)
  bot_host: str?
url: "https://cinexis.cloud"
